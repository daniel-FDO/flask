{%extends "base.html"%}
{% block title%}Event details | CoderDojo {% endblock %}
{%block content%}
    <h1>{{event.Title}}</h1>
    <table class="details">
    <tr><th>Date</th><td>{{event.EventDate}}</td></tr>
    <tr><th>Time</th><td>{{event.StartTime}} to {{event.EndTime}}</td></tr>
    <tr><th>Location</th><td>{{event.Location}}</td></tr>
    <tr><th>Places</th><td>{{event.Capacity}}</td></tr>
    </table>
    <a href="{{ url_for('event_list') }}">Back to all events</a>
{% endblock %}
